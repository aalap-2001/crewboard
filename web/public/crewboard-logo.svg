<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Crewboard</title>
  <desc id="desc">Crewboard wordmark with a rounded indigo board icon containing two task cards.</desc>
  <defs>
    <linearGradient id="brand" x1="16" y1="18" x2="130" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="152" height="160" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#312E81" flood-opacity=".15"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="16" y="18" width="112" height="112" rx="31" fill="url(#brand)"/>
    <rect x="38" y="42" width="68" height="64" rx="12" fill="white" fill-opacity=".15" stroke="white" stroke-opacity=".92" stroke-width="3"/>
    <path d="M38 58h68" stroke="white" stroke-opacity=".92" stroke-width="3"/>
    <circle cx="48" cy="50" r="2.5" fill="white"/>
    <circle cx="57" cy="50" r="2.5" fill="white" fill-opacity=".7"/>
    <rect x="48" y="69" width="19" height="26" rx="5" fill="white"/>
    <rect x="75" y="69" width="21" height="8" rx="4" fill="white" fill-opacity=".56"/>
    <rect x="75" y="83" width="21" height="12" rx="5" fill="#C7D2FE"/>
    <path d="m79 89 3 3 7-7" stroke="#4338CA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="152" y="99" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="750" letter-spacing="-2.5">Crewboard</text>
  <text x="155" y="129" fill="#6B7280" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="550" letter-spacing=".15">Your crew, your board, your flow.</text>
