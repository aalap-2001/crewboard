name: Create admin

on:
  workflow_dispatch:
    inputs:
      email:
        description: Admin email address
        required: true
      name:
        description: Display name
        required: true

jobs:
  create-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      APP_URL: ${{ vars.APP_URL }}
      ADMIN_EMAIL: ${{ inputs.email }}
      ADMIN_NAME: ${{ inputs.name }}
    steps:
      - name: Check configuration
        run: |
          [ -n "$FIREBASE_PROJECT_ID" ] || { echo "::error::Missing Actions settings: FIREBASE_PROJECT_ID"; exit 1; }
          [ -n "$APP_URL" ] || { echo "::error::Missing Actions settings: APP_URL"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Create admin
        run: node scripts/create-admin.mjs --project "$FIREBASE_PROJECT_ID" --app-url "$APP_URL" --email "$ADMIN_EMAIL" --name "$ADMIN_NAME"
