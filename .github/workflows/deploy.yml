name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      APP_URL: ${{ vars.APP_URL }}
      DIGEST_TIMEZONE: ${{ vars.DIGEST_TIMEZONE }}
      VITE_USE_EMULATORS: "false"
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FUNCTIONS_REGION: ${{ vars.VITE_FUNCTIONS_REGION }}
    steps:
      - name: Check configuration
        run: |
          missing=""
          for v in FIREBASE_PROJECT_ID APP_URL DIGEST_TIMEZONE VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_APP_ID VITE_FUNCTIONS_REGION; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Actions settings:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci --prefix functions
          npm ci --prefix web

      - name: Write functions environment file
        run: |
          printf 'APP_URL=%s\nDIGEST_TIMEZONE=%s\n' "$APP_URL" "$DIGEST_TIMEZONE" > "functions/.env.$FIREBASE_PROJECT_ID"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1015009577762/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deployer@crewboard-42ded.iam.gserviceaccount.com

      - name: Deploy
        run: npx --yes firebase-tools@13 deploy --only hosting,firestore --project "$FIREBASE_PROJECT_ID" --non-interactive --force

  # Publishes the web app to GitHub Pages at https://<owner>.github.io/<repo>/
  # (Settings › Pages › Source must be "GitHub Actions").
  pages:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
      VITE_USE_EMULATORS: "false"
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FUNCTIONS_REGION: ${{ vars.VITE_FUNCTIONS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web app for Pages
        run: |
          npm ci --prefix web
          npm --prefix web run build
          # Single-page app: serve index.html for deep links like /crewboard/boards/123
          cp web/dist/index.html web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
